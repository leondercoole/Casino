  },
  slotOf(x, G) { for (let i = 0; i < G.N; i++) if (x < G.bounds[i + 1]) return i; return G.N - 1; },
  newBall(G) { return { x: G.cx + rand(-0.9, 0.9) * G.sx, y: G.top - G.sy * 0.9, vx: rand(-15, 15) * G.k, vy: 0 }; },
  /** Auszahlungstabelle per Simulation (CONFIG.plinkoSimDrops Testwürfe), Ziel-EV ≈ 0.95 */
  calibrate(rows, risk, done) {
    const key = rows + risk;
    if (this.tables[key]) { done && done(); return; }
    try { const c = JSON.parse(localStorage.getItem('brainrotPlinkoCache_v4') || '{}'); if (c[key]) { this.tables[key] = c[key]; done && done(); return; } } catch (e) { }
    if (this.calibrating) return;
    const G = this.geo(rows, risk), counts = new Array(G.N).fill(0), total = CONFIG.plinkoSimDrops, dt = 1 / 120;
    let doneN = 0; this.calibrating = key; this.calibPct = 0;
    const chunk = () => {
      const end = Math.min(total, doneN + 600);
      for (; doneN < end; doneN++) {
        const b = this.newBall(G); let t = rand(0, 100), steps = 0;
        while (!this.step(b, G, dt, t, false) && steps < 3000) { t += dt; steps++; }
        counts[this.slotOf(b.x, G)]++;
      }
      this.calibPct = doneN / total;
      if (doneN < total) { setTimeout(chunk, 0); return; }
      this.tables[key] = this.buildTable(G, counts.map(c => c / total));
      try { const c = JSON.parse(localStorage.getItem('brainrotPlinkoCache_v4') || '{}'); c[key] = this.tables[key]; localStorage.setItem('brainrotPlinkoCache_v4', JSON.stringify(c)); } catch (e) { }
      this.calibrating = null; done && done();
    };
    chunk();
  },
  buildTable(G, p) {
    const target = CONFIG.targetEV.plinko, rk = this.RISK[G.risk], C = G.C, R = G.rows / 2;
    const pc = Math.max(p[C], 1e-4);
    const mc = Math.round(Math.min(rk.mc[G.rows] || 50, rk.cf * target / pc));
    let rest = 0; for (let i = 0; i < G.N; i++) if (i !== C) rest += p[i] * rk.shape(Math.abs(i - C), R);
    let s = (target - pc * mc) / Math.max(rest, 1e-6), mults, ev;
    const round = v => v >= 10 ? Math.round(v) : Math.round(v * 100) / 100;
    // Iterativ nachjustieren, damit der EV trotz Rundung möglichst genau beim Ziel liegt
    for (let it = 0; it < 12; it++) {
      mults = []; for (let i = 0; i < G.N; i++) mults.push(round(i === C ? mc : rk.shape(Math.abs(i - C), R) * s));
      for (let i = 0; i < G.N; i++) if (i !== C && mults[i] >= mults[C]) mults[i] = round(mults[C] * 0.5);
      ev = mults.reduce((a, m, i) => a + m * p[i], 0);
      const restEv = ev - mults[C] * p[C];
      if (Math.abs(ev - target) < 0.002 || restEv <= 0) break;
      s *= (target - mults[C] * p[C]) / restEv;
    }
    return { mults, p, ev };
  },
  cfg() { return { rows: S.plinko.rows, risk: S.plinko.risk }; },
  table() { const c = this.cfg(); return this.tables[c.rows + c.risk]; }
};

    for (let i = cells.length - 1; i > 0; i--) { const j = randi(0, i); [cells[i], cells[j]] = [cells[j], cells[i]]; }
    return { win, cells, mult: win ? win.m * this.k : 0 };
  },
  busy() { return this.state === 'scratch'; },
  play(o = {}) {
    if (this.state === 'scratch') { this.reveal(); return; }
    if (o.auto && !Eco.mods.autoScratch) { Games.stopAuto('scratch'); UI.toast('🧽 Für Auto-Rubbellose brauchst du "Auto-Rubbeln" im Skill-Tree!'); return; }
    const bet = Eco.betFor('scratch');
    if (!Eco.take('scratch', bet)) { Games.stopAuto('scratch'); return; }
    this.bet = bet; this.auto = !!o.auto;
    this.r = Eco.luckyRoll(() => this.outcome(), r => !!r.win);
    $('#scGrid').innerHTML = this.r.cells.map(s => `<div>${s}</div>`).join('');
    this.cover(false); this.state = 'scratch'; SND.card();
    setResult(this.res, 'Rubbel, Bro! (oder Leertaste = aufdecken)', '');
    if (o.auto && Eco.mods.autoScratch) setTimeout(() => this.reveal(), 500);
  },
  reveal() {
    if (this.state !== 'scratch') return;
    this.state = 'idle';
    this.cv.style.transition = 'opacity .4s'; this.cv.style.opacity = 0;
    const r = this.r;
    if (r.win) $$('#scGrid div').forEach(d => { if (d.textContent === r.win.s) d.classList.add('win'); });
    const info = Eco.settle('scratch', this.bet, r.mult, { auto: this.auto, noFx: r.win && r.win.m >= 25 });
    if (r.win && r.win.m >= 25) { S.stats.flags.scrTop = true; Eco.jackpot(info, r.win.m >= 100 ? 5 : 2); }
    setResult(this.res, r.win ? `${r.win.s}${r.win.s}${r.win.s}! ${fmtX(r.mult)} → +${fmt(info.net)}${r._rerolled ? ' 🍀' : ''}` : info.rescued ? 'Niete, aber gerettet 🔄' : pick(['Niete 💀', 'nichts. absolut nichts.', 'L-Los']), r.win ? 'win' : 'lose');
  }
});

/* =====================================================================
   UPGRADES – Shop-UI (Bots, Basis, Spiel-Upgrades, Gems, VIP)
   ===================================================================== */
const Upg = {
  qty: 1,
  shopCost(u, l) { return Math.ceil(u.base * Math.pow(CONFIG.costScale, l)); },
  gameCost(u, l) { return u.costs ? u.costs[l] : Math.ceil(u.base * Math.pow(CONFIG.gameUpCostScale, l)); },
  gemCost(u, l) { return Math.ceil(u.base * Math.pow(1.5, l)); },
  /** wie viele Bots kaufen + Kosten */
  botPlan(b) {
    const own = S.bots[b.id] || 0;
    let n = 0, cost = 0;
    const want = this.qty === 'max' ? 1e4 : this.qty;
    while (n < want) { const c = Eco.botCost(b, own + n); if (this.qty === 'max' && cost + c > S.chips) break; cost += c; n++; }
    if (this.qty === 'max' && n === 0) { n = 1; cost = Eco.botCost(b, own); }
    return { n, cost };
  },
  info(kind, id) {
    if (kind === 'bot') {
      const b = BOTS.find(x => x.id === id), own = S.bots[id] || 0, plan = this.botPlan(b);
      const idx = BOTS.indexOf(b), prevOwned = idx === 0 || (S.bots[BOTS[idx - 1].id] || 0) > 0 || own > 0;
      const nextMs = BOT_MILESTONES.find(t => own < t);
      const each = b.cps * Eco.botMilestoneMul(own || 1) * (1 + Eco.mods.passiveAdd) * Eco.mods.passiveMul;
      return { icon: b.icon, name: b.name, desc: b.desc, lvl: `Besitz: ${own} · je ${fmt(each)}/s · gesamt ${fmt(Eco.botCps(b) * (1 + Eco.mods.passiveAdd) * Eco.mods.passiveMul)}/s${nextMs ? ` · ×2 bei ${nextMs}` : ''}`,
        cost: plan.cost, cur: '🪙', btn: `+${plan.n} · ${fmt(plan.cost)}`, can: S.chips >= plan.cost, locked: !prevOwned, lockTxt: 'Kauf erst den vorherigen Bot' };
    }
    if (kind === 'shop') { const u = SHOP.find(x => x.id === id), l = S.shop[id] || 0, c = this.shopCost(u, l); return { icon: u.icon, name: u.name, desc: u.desc, lvl: `Stufe ${l}/${u.max}`, cost: c, cur: '🪙', maxed: l >= u.max, can: S.chips >= c }; }
    if (kind === 'game') { const u = GAME_UP.find(x => x.id === id), l = S.gameUp[id] || 0, c = l < u.max ? this.gameCost(u, l) : 0; return { icon: u.icon, name: u.name, desc: u.desc, lvl: `${GAME_META[u.game].icon} ${GAME_META[u.game].name} · Stufe ${l}/${u.max}`, cost: c, cur: '🪙', maxed: l >= u.max, can: S.chips >= c }; }
    if (kind === 'gem') { const u = GEM_SHOP.find(x => x.id === id), l = S.gemUp[id] || 0, c = this.gemCost(u, l); return { icon: u.icon, name: u.name, desc: u.desc, lvl: `Stufe ${l}/${u.max}`, cost: c, cur: '💎', maxed: l >= u.max, can: S.gems >= c }; }
    if (kind === 'vip') { const u = VIP.find(x => x.id === id), own = !!S.vip[id], rk = CONFIG.ranks[u.rank]; return { icon: u.icon, name: u.name, desc: u.desc, lvl: `ab Rang ${rk.icon} ${rk.name}`, cost: u.cost, cur: '🪙', maxed: own, can: S.chips >= u.cost, locked: S.rankIdx < u.rank, lockTxt: `🔒 Rang ${rk.name} nötig` }; }
  },
  itemHtml(kind, id) { return `<div class="upg" data-k="${kind}" data-id="${id}"><div class="ic"></div><div class="bd"><div class="nm"></div><div class="ds"></div><div class="lv"></div></div><button class="btn sm green" data-buy="1"></button></div>`; },
  render() {
    const v = $('#view-upgrades');
    const gameGroups = GAME_IDS.map(g => GAME_UP.filter(u => u.game === g).map(u => this.itemHtml('game', u.id)).join('')).join('');
    v.innerHTML = `
      <div class="panel"><div class="secTitle"><h2>🤖 Automaten & Croupiers</h2><div class="row"><span class="pill" id="upPassive"></span>
        <span class="small">Kaufmenge:</span>${[1, 10, 'max'].map(q => `<button class="btn sm ${this.qty === q ? 'sel' : 'dark'}" data-q="${q}">${q === 'max' ? 'MAX' : 'x' + q}</button>`).join('')}</div></div>
        <div class="small muted" style="margin-bottom:8px">Bots verdienen passiv – auch offline (bis ${Eco.mods.offlineHours}h, ${Math.round(Eco.mods.offlineEff * 100)}% Effizienz). Jeder Bot-Typ produziert ×2 bei 25/50/100/200/400 Stück.</div>
        <div class="grid2">${BOTS.map(b => this.itemHtml('bot', b.id)).join('')}</div></div>
      <div class="panel"><h2>⬆️ Basis-Upgrades</h2><div class="small muted" style="margin-bottom:8px">Kosten ×${CONFIG.costScale} pro Stufe. Gewinn-Boni wirken auf deinen Profit → so drehst du die House-Edge um.</div><div class="grid2">${SHOP.map(u => this.itemHtml('shop', u.id)).join('')}</div></div>
      <div class="panel"><h2>🎮 Spiel-Upgrades</h2><div class="grid2">${gameGroups}</div></div>
      <div class="panel" style="border-color:var(--c)"><h2>💎 Premium-Shop (Gems)</h2><div class="small muted" style="margin-bottom:8px">Gems gibt's aus Jackpots, Erfolgen, Quests, Events & Meilensteinen. Bleiben beim Prestige erhalten.</div><div class="grid2">${GEM_SHOP.map(u => this.itemHtml('gem', u.id)).join('')}</div></div>
      <div class="panel" style="border-color:var(--p)"><h2>👑 VIP-Lounge</h2><div class="small muted" style="margin-bottom:8px">Nur für Leute mit Rang. Steig auf, Bro.</div><div class="grid2">${VIP.map(u => this.itemHtml('vip', u.id)).join('')}</div></div>`;
    $$('[data-q]', v).forEach(b => b.onclick = () => { SND.click(); this.qty = b.dataset.q === 'max' ? 'max' : +b.dataset.q; this.render(); });
    v.onclick = e => { const b = e.target.closest('[data-buy]'); if (!b) return; const it = b.closest('.upg'); this.buy(it.dataset.k, it.dataset.id, b); };

  },
  refresh(full) {
    const v = $('#view-upgrades'); if (!v.firstChild) return;
    $('#upPassive', v) && ($('#upPassive', v).textContent = `Passiv: ${fmt(Eco.passive())}/s` + (Eco.interestPerSec() ? ` · Zinsen ${fmt(Eco.interestPerSec())}/s` : ''));
    $$('.upg', v).forEach(it => {
      const o = this.info(it.dataset.k, it.dataset.id); if (!o) return;
      if (full) { $('.ic', it).textContent = o.icon; $('.nm', it).textContent = o.name; $('.ds', it).textContent = o.desc; }
      const lv = $('.lv', it); if (lv.textContent !== (o.locked ? o.lockTxt : o.lvl)) lv.textContent = o.locked ? o.lockTxt : o.lvl;
      const b = $('[data-buy]', it), txt = o.maxed ? 'MAX ✅' : o.locked ? '🔒' : (o.btn || `${o.cur} ${fmt(o.cost)}`);
      if (b.textContent !== txt) b.textContent = txt;
      b.disabled = !!(o.maxed || o.locked || !o.can);
      it.classList.toggle('can', !o.maxed && !o.locked && o.can);
      it.classList.toggle('maxed', !!o.maxed); it.classList.toggle('locked', !!o.locked);
    });
  },
  /** Anzahl kaufbarer Upgrades (für Tab-Badge) */
  affordable() {
    let n = 0;
    SHOP.forEach(u => { const l = S.shop[u.id] || 0; if (l < u.max && S.chips >= this.shopCost(u, l)) n++; });
    BOTS.forEach((b, i) => { if ((i === 0 || S.bots[BOTS[i - 1].id]) && S.chips >= Eco.botCost(b, S.bots[b.id] || 0)) n++; });
    return n;
  },
  buy(kind, id, btn) {
    const o = this.info(kind, id); if (!o || o.maxed || o.locked || !o.can) { SND.denied(); return; }
    if (kind === 'bot') { const p = this.botPlan(BOTS.find(x => x.id === id)); if (S.chips < p.cost) return; S.chips -= p.cost; S.bots[id] = (S.bots[id] || 0) + p.n; }
    else if (kind === 'shop') { S.chips -= o.cost; S.shop[id] = (S.shop[id] || 0) + 1; }
    else if (kind === 'game') { S.chips -= o.cost; S.gameUp[id] = (S.gameUp[id] || 0) + 1; }
    else if (kind === 'gem') { S.gems -= o.cost; S.gemUp[id] = (S.gemUp[id] || 0) + 1; }
    else if (kind === 'vip') { S.chips -= o.cost; S.vip[id] = 1; FX.big(o.icon + ' VIP', 'win'); }
    Eco.recompute(); SND.buy();
    const p = FX.center(btn); FX.sparks(p.x, p.y, 25); FX.ring(p.x, p.y);
    if (kind === 'game') { const gd = Games.defs[GAME_UP.find(x => x.id === id).game]; if (gd.onShow) gd.onShow(); if (id === 'slots_reels') Games.defs.slots.buildReels(); if (id === 'plinko_balls') Games.defs.plinko.buildCtl(); }
    Bet.refreshAll(true); this.refresh(); Bus.emit('buy', { kind, id });
  }
};

/* =====================================================================
   SKILL-TREE – Node-Graph, zoom- & verschiebbar
   ===================================================================== */
const Tree = {
  z: 0.6, px: 0, py: 0, built: false, sel: null, dragged: false,
  pos(n) {
    if (n.pos) return { x: n.pos[0], y: n.pos[1] };
    if (n.br === 'core') return { x: 0, y: 0 };
    const a = BR[n.br].ang * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
    return { x: dx * n.d * 125 - dy * n.l * 100, y: dy * n.d * 125 + dx * n.l * 100 };
  },
  cost(n, l) { const base = n.cost != null ? n.cost : CONFIG.skillBaseCost * Math.pow(CONFIG.skillDepthScale, n.d - 1) * BR[n.br].mul; return Math.ceil(base * Math.pow(CONFIG.skillCostScale, l)); },
  visible(n) { return n.br !== 'void' || S.prestigeCount >= 3; },
  branchOpen(n) { if (n.br === 'void') return S.prestigeCount >= 3; const lv = CONFIG.branchLvl[n.br]; return lv == null || S.aura.lvl >= lv; },
  reqMet(n) { return n.req.every(r => (S.skills[r] || 0) > 0); },
  canBuy(n) { const l = S.skills[n.id] || 0; return l < n.max && this.branchOpen(n) && this.reqMet(n) && S.chips >= this.cost(n, l) && S.gems >= (n.gems || 0); },
  state(n) {
    const l = S.skills[n.id] || 0;
    if (l >= n.max) return 'max';
    const open = this.branchOpen(n) && this.reqMet(n);
    if (!open) return l > 0 ? 'owned' : 'locked';
    return (l > 0 ? 'owned' : 'avail') + (this.canBuy(n) ? ' can' : '');
  },
  ownedCount() { return SKILLS.filter(n => n.id !== 'core' && (S.skills[n.id] || 0) > 0).length; },
  affordable() { return SKILLS.filter(n => this.visible(n) && this.canBuy(n)).length; },
  build() {
    const inner = $('#treeInner'), svg = $('#treeSvg');
    $$('.node,.branchLbl', inner).forEach(e => e.remove());
    let lines = '';
    SKILLS.forEach(n => {
      if (!this.visible(n)) return;
      const p = this.pos(n);
      n.req.forEach(r => { const q = this.pos(SK[r]); lines += `<line data-a="${r}" data-b="${n.id}" x1="${q.x + 2000}" y1="${q.y + 2000}" x2="${p.x + 2000}" y2="${p.y + 2000}" stroke-width="5" stroke-linecap="round"/>`; });
      const d = el('div', 'node' + (n.end ? ' end' : ''), `${n.icon}<span class="nl"></span>`);
      d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; d.dataset.id = n.id; d.title = n.name;
      d.onclick = () => { if (this.dragged) return; SND.click(); this.select(n.id); };
      inner.appendChild(d);
    });
    svg.innerHTML = lines;
    Object.entries(BR).forEach(([k, b]) => {
      if (k === 'void' && S.prestigeCount < 3) return;
      const a = b.ang * Math.PI / 180, l = el('div', 'branchLbl', b.name + (CONFIG.branchLvl[k] ? `<br><small style="font-size:14px">ab Aura-Lvl ${CONFIG.branchLvl[k]}</small>` : ''));
      l.style.left = Math.cos(a) * 920 + 'px'; l.style.top = Math.sin(a) * 920 + 'px'; l.style.color = b.color; inner.appendChild(l);
    });
    this.built = S.prestigeCount;
    this.refresh();
  },
  refresh() {
    $$('#treeInner .node').forEach(d => {
      const n = SK[d.dataset.id], st = this.state(n), l = S.skills[n.id] || 0;
      const cls = 'node' + (n.end ? ' end ' : ' ') + st;
      if (d.className !== cls) d.className = cls;
      const lbl = n.max > 1 ? `${l}/${n.max}` : (l ? '✔' : this.branchOpen(n) ? fmt(this.cost(n, 0)) : '🔒');
      const nl = d.lastChild; if (nl.textContent !== lbl) nl.textContent = lbl;
    });
    $$('#treeSvg line').forEach(ln => {
      const a = S.skills[ln.dataset.a] || 0, b = S.skills[ln.dataset.b] || 0, n = SK[ln.dataset.b];
      const col = a && b ? (BR[n.br] ? BR[n.br].color : '#ff2bd6') : a ? 'rgba(255,255,255,.55)' : 'rgba(120,120,140,.35)';
      if (ln.getAttribute('stroke') !== col) ln.setAttribute('stroke', col);
    });
    if (this.sel) this.info();
  },
  apply() { $('#treeInner').style.transform = `translate(${this.px}px,${this.py}px) scale(${this.z})`; },
  center() { const w = $('#treeWrap').getBoundingClientRect(); this.z = w.width < 600 ? 0.38 : 0.55; this.px = w.width / 2; this.py = w.height / 2 + 40 * this.z; this.apply(); },
  zoomAt(f, cx, cy) { const nz = clamp(this.z * f, 0.2, 2); this.px = cx - (cx - this.px) * nz / this.z; this.py = cy - (cy - this.py) * nz / this.z; this.z = nz; this.apply(); },
  bind() {
    const w = $('#treeWrap'), pts = new Map(); let start = null, pinch = null;
    w.addEventListener('pointerdown', e => { if (e.target.closest('#nodeInfo,.treeCtl')) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); this.dragged = false; start = { x: e.clientX, y: e.clientY, px: this.px, py: this.py }; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: this.z }; } });
    w.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()], r = w.getBoundingClientRect(); const d = Math.hypot(a.x - b.x, a.y - b.y); this.zoomAt(pinch.z * d / pinch.d / this.z, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); this.dragged = true; return; }
      if (start) { const dx = e.clientX - start.x, dy = e.clientY - start.y; if (Math.abs(dx) + Math.abs(dy) > 6) this.dragged = true; if (this.dragged) { this.px = start.px + dx; this.py = start.py + dy; this.apply(); } }
    });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { start = null; setTimeout(() => this.dragged = false, 0); } };
    w.addEventListener('pointerup', up); w.addEventListener('pointercancel', up); w.addEventListener('pointerleave', up);
    w.addEventListener('wheel', e => { e.preventDefault(); const r = w.getBoundingClientRect(); this.zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    $('#treeZin').onclick = () => { const r = w.getBoundingClientRect(); this.zoomAt(1.2, r.width / 2, r.height / 2); };
    $('#treeZout').onclick = () => { const r = w.getBoundingClientRect(); this.zoomAt(0.83, r.width / 2, r.height / 2); };
    $('#treeReset').onclick = () => this.center();
  },
  select(id) { this.sel = id; this.info(); },
  info() {
    const box = $('#nodeInfo'), n = SK[this.sel]; if (!n) { box.classList.add('hidden'); return; }
    const l = S.skills[n.id] || 0, max = l >= n.max, c = this.cost(n, l);
    const reqTxt = n.req.length ? n.req.map(r => `${(S.skills[r] || 0) > 0 ? '✅' : '❌'} ${SK[r].icon} ${SK[r].name}`).join('<br>') : '';
    const brTxt = !this.branchOpen(n) ? (n.br === 'void' ? '🔒 Ab Prestige 3' : `🔒 Ast ab Aura-Level ${CONFIG.branchLvl[n.br]}`) : '';
    const sig = [n.id, l, max, this.canBuy(n), brTxt, reqTxt].join('|');
    if (box.dataset.sig === sig && !box.classList.contains('hidden')) return;
    box.dataset.sig = sig; box.classList.remove('hidden');
    box.innerHTML = `<div class="row" style="justify-content:space-between"><h3 style="margin:0">${n.icon} ${n.name}</h3><button class="btn sm dark" id="niX">✕</button></div>
      <div class="small" style="margin:6px 0">${n.desc}</div><div class="lv">Stufe ${l}/${n.max}</div>
      ${reqTxt ? `<div class="small" style="margin-top:6px">Benötigt:<br>${reqTxt}</div>` : ''}${brTxt ? `<div class="small neg">${brTxt}</div>` : ''}
      ${max ? '<div class="pos" style="margin-top:8px">✅ MAXIMIERT</div>' : `<button class="btn green" style="width:100%;margin-top:8px" id="niBuy" ${this.canBuy(n) ? '' : 'disabled'}>KAUFEN · 🪙 ${fmt(c)}${n.gems ? ` + ${n.gems} 💎` : ''}</button>`}`;
    $('#niX').onclick = () => { this.sel = null; box.classList.add('hidden'); };
    const b = $('#niBuy'); if (b) b.onclick = () => this.buy(n);
  },
  buy(n) {
    if (!this.canBuy(n)) { SND.denied(); return; }
    const l = S.skills[n.id] || 0; S.chips -= this.cost(n, l); if (n.gems) S.gems -= n.gems;
    S.skills[n.id] = l + 1; Eco.recompute(); SND.buy(); SND.chip();
    const d = $(`.node[data-id="${n.id}"]`); const p = FX.center(d);
    FX.confetti(p.x, p.y, 50); FX.sparks(p.x, p.y, 40, BR[n.br] ? BR[n.br].color : '#ff2bd6'); FX.ring(p.x, p.y); FX.ring(p.x, p.y, '#ff2bd6');
    if (n.end) { FX.big(n.icon + ' ' + n.name.toUpperCase(), 'win'); FX.flash(); SND.airhorn(); }
    Bet.refreshAll(true); Games.defs.crash.onShow && Games.defs.crash.onShow();
    this.refresh(); Bus.emit('skill', n);
  },
  render() { if (this.built !== S.prestigeCount || !$('#treeInner .node')) { this.build(); } if (!this.centered) { this.center(); this.centered = true; } this.refresh(); }
};

/* =====================================================================
   GAME EVENTS – zufällige Events, Glücksrad
   ===================================================================== */
const GameEvents = {
  list: [
    { id: 'happy', w: 3, run() { S.buffs.happyUntil = now() + CONFIG.happyHourSec * 1000; GameEvents.announce('🍹 HAPPY HOUR', `Alle Gewinne x2 für ${CONFIG.happyHourSec} Sekunden!`); } },
    { id: 'lucky', w: 3, run() { S.buffs.luckyUntil = now() + CONFIG.luckySec * 1000; GameEvents.announce('🍀 GLÜCKSSTRÄHNE', `+25% Reroll-Chance & +10% Zweite Chance für ${CONFIG.luckySec}s!`); } },
    { id: 'fever', w: 3, run() { S.buffs.feverUntil = now() + CONFIG.feverSec * 1000; GameEvents.announce('🔥 PLINKO-FIEBER', `Alle Plinko-Mittelfächer x3 für ${CONFIG.feverSec}s! Ab zum Neon Drop!`); } },
    { id: 'overclock', w: 2, cond: () => Eco.passive() > 0, run() { S.buffs.overclockUntil = now() + CONFIG.overclockSec * 1000; GameEvents.announce('⚙️ BOT-OVERCLOCK', `Passives Einkommen x3 für ${CONFIG.overclockSec}s!`); } },
    { id: 'tax', w: 2, cond: () => S.chips >= 500, run() { GameEvents.tax(); } },
    { id: 'stranger', w: 2, cond: () => S.chips >= 300, run() { GameEvents.stranger(); } },
    { id: 'gems', w: 1, run() { const g = randi(1, 3); Eco.addGems(g, true); GameEvents.announce('💎 GEM-REGEN', `Mr. Lucky hat Gems verloren. Du hast ${g} 💎 gefunden. Finders keepers.`); FX.rain(30, ['💎']); } }
  ],
  init() { if (!S.nextEventAt || S.nextEventAt < now() - 3600e3) S.nextEventAt = now() + CONFIG.eventFirstDelay * 1000; },
  tick() {

};

/* =====================================================================
   QUESTS – 3 tägliche Aufgaben
   ===================================================================== */
const Quests = {
  today() { return new Date().toDateString(); },
  tick() {
    if (S.quests.day === this.today() && S.quests.list.length) return;
    const pool = [...QUEST_POOL]; const list = [];
    while (list.length < 3 && pool.length) { const q = pool.splice(randi(0, pool.length - 1), 1)[0]; list.push({ id: q.id, p: 0, done: false, u: [] }); }
    S.quests = { day: this.today(), list };
  },
  onRound(info) {
    S.quests.list.forEach(q => {
      if (q.done) return; const d = QUEST_POOL.find(x => x.id === q.id); if (!d) return;
      const r = d.ev(info);
      if (r === 'reset') q.p = 0;
      else if (r && r.set != null) q.p = Math.max(q.p, r.set);
      else if (r && r.uniq) { if (!q.u.includes(r.uniq)) q.u.push(r.uniq); q.p = q.u.length; }
      else if (typeof r === 'number') q.p += r;
      if (q.p >= d.target) {
        q.done = true; q.p = d.target; S.stats.questsDone++; Eco.addGems(d.gems, true);
        SND.ach(); UI.toast(`<span class="tt">📜 QUEST ERLEDIGT</span><br>${d.txt}<br>+${d.gems} 💎`, 'ach');
        FX.confetti(FX.w / 2, 120, 60);
      }
    });
  },
  html() {
    return S.quests.list.map(q => { const d = QUEST_POOL.find(x => x.id === q.id); if (!d) return ''; const pct = Math.round(q.p / d.target * 100);
      return `<div class="upg ${q.done ? 'maxed' : ''}"><div class="ic">${q.done ? '✅' : '📜'}</div><div class="bd"><div class="nm">${d.txt}</div><div class="xpbar" style="height:10px"><i style="width:${pct}%"></i></div><div class="lv">${q.p}/${d.target} · Belohnung: ${d.gems} 💎</div></div></div>`; }).join('');
  },
  show() { UI.modal('📜 TÄGLICHE QUESTS', `<div style="display:flex;flex-direction:column;gap:8px">${this.html()}</div><p class="small muted">Neue Quests jeden Tag. Erledigte: ${S.stats.questsDone}</p>`, [{ label: 'Let him cook 👨‍🍳', cls: 'green' }]); }
};

/* =====================================================================
   SAVE – localStorage, Export/Import (Base64), Reset, Offline-Einkommen
   ===================================================================== */
const Save = {
  disabled: false,
  save() { if (this.disabled) return; S.lastSeen = now(); try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(S)); } catch (e) { console.warn('Speichern fehlgeschlagen', e); } },
  load() {
    try { const raw = localStorage.getItem(CONFIG.saveKey); if (!raw) return false; S = deepMerge(defaultState(), JSON.parse(raw)); return true; }
    catch (e) { console.warn('Save kaputt, starte neu', e); S = defaultState(); return false; }
  },
  export() { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); },
  import(str) {
    const d = JSON.parse(decodeURIComponent(escape(atob(str))));
    if (typeof d !== 'object' || typeof d.chips !== 'number') throw new Error('invalid');
    S = deepMerge(defaultState(), d); this.save(); this.disabled = true; location.reload();
  },
  reset() { this.disabled = true; try { localStorage.removeItem(CONFIG.saveKey); } catch (e) { } location.reload(); },
  offline() {
    const sec = (now() - (S.lastSeen || now())) / 1000;
    if (sec < 60) return;
    const capped = Math.min(sec, Eco.mods.offlineHours * 3600), gain = Math.floor(Eco.passive() * capped * Eco.mods.offlineEff);
    if (gain <= 0) return;
    S.chips += gain;
    UI.modal('😴 WILLKOMMEN ZURÜCK, BRO', `<p>Du warst <b>${fmtTime(sec)}</b> weg. Deine Bots haben weitergegrindet:</p><p style="font-size:34px;text-align:center" class="meme" >+${fmt(gain)} 🪙</p><p class="small muted">Max. ${Eco.mods.offlineHours}h · ${Math.round(Eco.mods.offlineEff * 100)}% Effizienz (upgradebar im Skill-Tree)</p>`, [{ label: 'LET\'S GOOO 🚀', cls: 'green', fn: () => { FX.confetti(FX.w / 2, FX.h / 2, 80); SND.register(); } }]);
  }
};

    FX.init(); UI.init(); Mascot.init(); Games.init(); Tree.bind(); GameEvents.init(); Quests.tick();
    UI.show('games');
    S.rankIdx = Math.max(S.rankIdx, Eco.rankFor(S.aura.lvl));
    if (Eco.sigma()) document.body.classList.add('sigma');
    UI.chipHist.push(S.chips);
    if (had) Save.offline();
    // erster Start: Lichtempfindlichkeits-Hinweis → Tutorial
    if (!S.settings.warned) {
      UI.modal('⚠️ ACHTUNG, BRO', `<p>Dieses Spiel ist <b>MAXIMAL überstimulierend</b>: Blitze, Screen-Shake, schnelle Farbwechsel und laute Sounds.</p><p><b>Hinweis zu Lichtempfindlichkeit/Epilepsie:</b> Wenn du empfindlich auf Lichtblitze reagierst, aktiviere bitte den <b>Chill-Modus</b> (jederzeit in den Einstellungen änderbar).</p><p class="small muted">Nur Spielgeld. Kein echtes Geld, keine Käufe.</p>`, [
        { label: '🧘 Chill-Modus', cls: 'cyan', fn: () => { S.settings.chill = true; UI.applyChill(); this.afterWarn(); } },
        { label: '🔥 VOLLE DOSIS', cls: 'pink', fn: () => { S.settings.chill = false; UI.applyChill(); this.afterWarn(); } }
      ], { noClose: true });
    } else if (!S.settings.tutorialDone) Tut.start();
    // Plinko schon im Hintergrund kalibrieren (für Auto-Drop & schnellen Start)
    setTimeout(() => Games.defs.plinko.ensure(), 1200);
    // Eingaben
    const unlock = () => SND.unlock();
    window.addEventListener('pointerdown', unlock); window.addEventListener('keydown', unlock);
    window.addEventListener('keydown', e => this.key(e));
    setInterval(() => Save.save(), CONFIG.autosaveMs);
    window.addEventListener('beforeunload', () => Save.save());
    window.addEventListener('pagehide', () => Save.save());
    document.addEventListener('visibilitychange', () => this.vis());
    if (DEBUG) this.debug();
    this.last = performance.now();
    requestAnimationFrame(t => this.frame(t));
  },
  afterWarn() { S.settings.warned = true; Save.save(); if (!S.settings.tutorialDone) setTimeout(() => Tut.start(), 300); },
  frame(t) {
    const dt = Math.min(0.1, Math.max(0, (t - this.last) / 1000)); this.last = t;
    try {
      Eco.tick(dt);
      Games.update(dt);
      FX.update(dt);
      UI.tick(dt);
      this.secAcc += dt;
      if (this.secAcc >= 1) { this.secAcc = 0; Ach.check(); GameEvents.tick(); Quests.tick(); }
      this.perf(dt);
      this.histAcc += dt;
      if (this.histAcc >= 5) { this.histAcc = 0; UI.chipHist.push(S.chips); if (UI.chipHist.length > 60) UI.chipHist.shift(); }
    } catch (err) { console.error(err); }
    requestAnimationFrame(tt => this.frame(tt));
  },
  /** Performance-Wächter: misst FPS; bei dauerhaft < 42 FPS wird der teure Hintergrund pausiert */
  perf(dt) {
    this.pf = this.pf || { n: 0, t: 0, low: 0 };
    const p = this.pf; p.n++; p.t += dt;
    if (p.t < 4) return;
    const fps = p.n / p.t; p.n = 0; p.t = 0;
    if (fps < 42 && !document.hidden) { if (++p.low >= 2 && !document.body.classList.contains('lowfx')) { document.body.classList.add('lowfx'); FX.low = true; console.info('[Brainrot Casino] Auto-Performance aktiv (' + fps.toFixed(0) + ' FPS) – Hintergrund-Animation pausiert'); } }
    else p.low = 0;
  },
  /** Tab im Hintergrund: Einkommen nachholen */
  vis() {
    if (document.hidden) { this.hiddenAt = now(); Save.save(); return; }
    if (!this.hiddenAt) return;
    const sec = (now() - this.hiddenAt) / 1000; this.hiddenAt = 0;
    if (sec > 300) { S.lastSeen = now() - sec * 1000; Save.offline(); }
    else if (sec > 1) { S.chips += Eco.passive() * sec; S.stats.playTime += sec; }
    this.last = performance.now();
  },
  key(e) {
    const tg = e.target, tag = tg && tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (UI.modalOpen() || Tut.on) return;
    if (e.code === 'Space') {
      e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      if (UI.tab !== 'games') UI.show('games');
      Games.play(); return;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 8) { UI.show('games'); Games.show(GAME_IDS[n - 1]); SND.click(); }
  },
  debug() {
    const d = el('div', '', ''); d.id = 'debug';
    const btn = (l, f) => { const b = el('button', 'btn sm red', l); b.onclick = f; d.appendChild(b); };
    const tg = el('button', 'btn sm dark', '🐞 DEBUG'); d.appendChild(tg);
    tg.onclick = () => $$('#debug .red').forEach(b => b.classList.toggle('hidden'));
    btn('+1M Chips', () => { S.chips += 1e6; });
    btn('+1B Chips', () => { S.chips += 1e9; });
    btn('+100 💎', () => { S.gems += 100; });
    btn('+10 🪙', () => { S.tokens += 10; });
    btn('+5 Aura-Lvl', () => { S.aura.lvl += 5; const ri = Eco.rankFor(S.aura.lvl); if (ri > S.rankIdx) { S.rankIdx = ri; UI.rankUp(ri); } });
    btn('Event', () => { S.nextEventAt = 0; });
    btn('Jackpot', () => FX.jackpot(123456, 3));
    btn('Sigma', () => Eco.startSigma());
    btn('Wheel reset', () => { S.lastWheel = 0; });
    document.body.appendChild(d); $$('#debug .red').forEach(b => b.classList.add('hidden'));
    window.__game = { S: () => S, Eco, Games, Plinko, FX, UI, Save, Tree, Prestige };
  }
};
window.addEventListener('DOMContentLoaded', () => Main.init());
</script>
</body>
</html>
